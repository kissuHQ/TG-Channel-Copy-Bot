<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Archive Bot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/multipage.css">
  <style>
    body.login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #f5f7fb;
    }
    .login-card {
      width: min(420px, calc(100% - 32px));
      padding: 32px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .10);
    }
    .login-card h1 { margin: 0 0 8px; color: #0f172a; }
    .login-card p { color: #64748b; margin: 0 0 24px; }
    .login-card label { display: grid; gap: 8px; font-weight: 600; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    .login-card button {
      width: 100%;
      margin-top: 20px;
      cursor: pointer;
    }
    .login-error {
      margin-bottom: 16px;
      padding: 10px 12px;
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
    }
  </style>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">AB</div>
    <h1>Sign in to Archive Bot</h1>
    <p>Enter the dashboard password to continue.</p>
    {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <input class="visually-hidden" id="username" name="username" type="text" value="dashboard" autocomplete="username" tabindex="-1">
      <label for="password">
        Dashboard password
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
